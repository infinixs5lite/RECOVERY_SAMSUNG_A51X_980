name: Recovery - Build

# Credits to:
# https://github.com/TeamWin
# https://gitlab.com/OrangeFox
# https://github.com/SHRP
# https://github.com/PitchBlackRecoveryProject

on:
  workflow_dispatch:
    inputs:
      BUILD_RECOVERY:
        description: 'Recovery Type'
        required: true
        default: 'OFRP'
        type: choice
        options:
          - 'OFRP'
          - 'SHRP'
          - 'TWRP'
          - 'PBRP'
      MANIFEST:
        description: 'Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
          - '12.1'
          - '11.0'
      DEVICE_TREE:
        description: 'Device Tree'
        required: true
        default: 'https://github.com/TDD788/M12-DevTree'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'DT-Builder'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/samsung/m12'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'm12'
      KERNEL:
        description: 'Add kernel Source'
        required: false
        default: ''
      BUILD_TARGET:
        description: "Set partition to build"
        required: true
        default: 'recovery'
        type: choice
        options:
          - 'vendorboot'
          - 'boot'
          - 'recovery'
      RELEASE_TYPE:
        description: 'Normal Released Build'
        required: true
        default: true
        type: boolean
      POST_TO_TELEGRAM:
        description: 'Post to Telegram'
        required: true
        default: true
        type: boolean
       
jobs:
  Build-OrangeFox:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.BUILD_RECOVERY == 'OFRP' }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CCACHE_BASEDIR: "${{ github.workspace }}"
    permissions:
      contents: write
    steps: 
    - name: Set env based on input
      id: set-manifest
      run: |
        if [[ "${{ github.event.inputs.MANIFEST }}" == "12.1" ]]; then
          echo "MANIFEST=fox-12.1" >> $GITHUB_ENV
        elif [[ "${{ github.event.inputs.MANIFEST }}" == "11.0" ]]; then
          echo "MANIFEST=fox-11.0" >> $GITHUB_ENV
        fi
        
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: "recursive"
        fetch-depth: 0
              
    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16
       
    - name: Build Environment
      run: |
       sudo apt-get update
       sudo apt-get install -y ca-certificates curl
       sudo install -m 0755 -d /etc/apt/keyrings
       sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
       sudo chmod a+r /etc/apt/keyrings/docker.asc
       echo \
         "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
         $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
       sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
       sudo apt-get update
       sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
       sudo apt install lz4
       sudo apt install gzip
       sudo apt install nodejs
       sudo apt install lzma
       sudo apt install git aria2 -y
       sudo apt install nodejs
       sudo apt install ccache
       git clone https://gitlab.com/OrangeFox/misc/scripts
       cd scripts

